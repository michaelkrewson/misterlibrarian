<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-label="Five small panels, one per oil shock: 1973, 1979, 1990, 2022 and 2026. The top row shows the oil price change from the month the shock began over the following eighteen months: up 134 percent in 1973, up 166 percent by 1980, up 93 percent then back down in 1990, up 38 percent then down in 2022, and up 58 percent then partly back in 2026. The bottom row shows the change in the federal funds rate over the same months: up about two points then down in 1973, up eight points by 1980, cut by three points in 1990, up four and a quarter points in 2022, and unchanged so far in 2026.">
