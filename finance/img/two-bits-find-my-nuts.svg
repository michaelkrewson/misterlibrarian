<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"
     aria-label="How a 409-byte ecash token rode Apple's Find My network. A small board with no internet broadcasts fake AirTag beacons, each carrying two bits hidden in its public key. Passing iPhones upload ordinary encrypted location reports to Apple's servers, which file each report under a hash of that key. A receiver signed in with an Apple Account tries all four possible keys for every two-bit slot, keeps the ones that got reports, and redeems the finished token at the Cashu mint. Totals: 1,676 two-bit pieces, 13,407 reports, about 52 minutes per broadcast pass.">
  <rect width="900" height="420" fill="#0a0f1a"/>

  <text x="40" y="50" font-family="Georgia, serif" font-size="21" fill="#e8dfd2">How a 409-byte ecash token rode <tspan fill="#e8865c">Apple's Find My</tspan></text>
  <text x="40" y="76" font-family="Georgia, serif" font-size="14" fill="#94a3b8">No internet on the sending side. Strangers' iPhones carried it, two bits at a time.</text>

  <!-- arrows between stations -->
  <g stroke="#5c6b85" stroke-width="2.5" fill="none" stroke-dasharray="7,6">
    <line x1="160" y1="170" x2="200" y2="170"/>
    <line x1="340" y1="170" x2="380" y2="170"/>
    <line x1="520" y1="170" x2="560" y2="170"/>
    <line x1="700" y1="170" x2="740" y2="170"/>
  </g>
  <g fill="#5c6b85">
    <path d="M200 164 L210 170 L200 176 Z"/>
    <path d="M380 164 L390 170 L380 176 Z"/>
    <path d="M560 164 L570 170 L560 176 Z"/>
    <path d="M740 164 L750 170 L740 176 Z"/>
  </g>

  <!-- 1: the board -->
  <rect x="40" y="120" width="120" height="100" rx="10" fill="#111a2b" stroke="#e8865c" stroke-width="2"/>
  <rect x="70" y="140" width="60" height="38" rx="3" fill="#1d2a40" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="100" y="163" text-anchor="middle" font-family="Menlo, monospace" font-size="8" fill="#e8dfd2">FIND MY NUTS</text>
  <rect x="70" y="182" width="60" height="10" rx="2" fill="#c9a227" opacity="0.85"/>
  <text x="100" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">ESP32 + battery</text>
  <text x="100" y="246" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e8dfd2" font-weight="bold">The wallet</text>
  <text x="100" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#94a3b8">holds the ecash,</text>
  <text x="100" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#94a3b8">no Wi-Fi, no cell</text>

  <!-- 2: beacons -->
  <rect x="220" y="120" width="120" height="100" rx="10" fill="#111a2b" stroke="#5c6b85" stroke-width="1.5"/>
  <circle cx="280" cy="170" r="6" fill="#e8865c"/>
  <g stroke="#e8865c" stroke-width="2" fill="none" opacity="0.85">
    <path d="M266 156 A20 20 0 0 0 266 184"/>
    <path d="M294 156 A20 20 0 0 1 294 184"/>
    <path d="M256 146 A34 34 0 0 0 256 194" opacity="0.6"/>
    <path d="M304 146 A34 34 0 0 1 304 194" opacity="0.6"/>
  </g>
  <text x="280" y="210" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#a3b378">key …00 01 10 11</text>
  <text x="280" y="246" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e8dfd2" font-weight="bold">Fake AirTags</text>
  <text x="280" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#94a3b8">2 bits hidden in</text>
  <text x="280" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#94a3b8">each key, 1.6 s each</text>

  <!-- 3: iPhones -->
  <rect x="400" y="120" width="120" height="100" rx="10" fill="#111a2b" stroke="#5c6b85" stroke-width="1.5"/>
  <g fill="#1d2a40" stroke="#e8dfd2" stroke-width="1.3">
    <rect x="424" y="142" width="20" height="38" rx="4"/>
    <rect x="450" y="136" width="20" height="38" rx="4"/>
    <rect x="476" y="146" width="20" height="38" rx="4"/>
  </g>
  <text x="460" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">anyone nearby</text>
  <text x="460" y="246" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e8dfd2" font-weight="bold">Passing iPhones</text>
  <text x="460" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#94a3b8">upload a report,</text>
  <text x="460" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#94a3b8">never know it's money</text>

  <!-- 4: Apple's servers -->
  <rect x="580" y="120" width="120" height="100" rx="10" fill="#111a2b" stroke="#5c6b85" stroke-width="1.5"/>
  <path d="M612 182 a14 14 0 0 1 4 -27 a20 20 0 0 1 37 -6 a15 15 0 0 1 20 16 a12 12 0 0 1 -4 17 Z" fill="#1d2a40" stroke="#e8dfd2" stroke-width="1.3"/>
  <text x="640" y="210" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#a3b378">hash(key) → report</text>
  <text x="640" y="246" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e8dfd2" font-weight="bold">Apple's servers</text>
  <text x="640" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#94a3b8">file it by key hash,</text>
  <text x="640" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#94a3b8">can't read inside</text>

  <!-- 5: receiver + mint -->
  <rect x="760" y="120" width="120" height="100" rx="10" fill="#111a2b" stroke="#a3b378" stroke-width="2"/>
  <g font-family="Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="800" y="148" fill="#5c6b85">0 ✗</text><text x="840" y="148" fill="#5c6b85">1 ✗</text>
    <text x="800" y="170" fill="#a3b378" font-weight="bold">2 ✓</text><text x="840" y="170" fill="#5c6b85">3 ✗</text>
  </g>
  <text x="820" y="194" text-anchor="middle" font-family="Menlo, monospace" font-size="11" fill="#e8865c">cashuB…</text>
  <text x="820" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">→ Cashu mint</text>
  <text x="820" y="246" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e8dfd2" font-weight="bold">The receiver</text>
  <text x="820" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#94a3b8">asks for all 4 keys,</text>
  <text x="820" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#94a3b8">keeps the one with reports</text>

  <!-- totals -->
  <line x1="40" y1="312" x2="880" y2="312" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="170" y="354" font-size="28" fill="#e8865c" font-weight="bold">1,676</text>
    <text x="170" y="378" font-size="13" fill="#94a3b8">two-bit pieces (419 bytes × 4)</text>
    <text x="450" y="354" font-size="28" fill="#e8dfd2" font-weight="bold">13,407</text>
    <text x="450" y="378" font-size="13" fill="#94a3b8">reports, about eight per piece</text>
    <text x="730" y="354" font-size="28" fill="#a3b378" font-weight="bold">≈52 min</text>
    <text x="730" y="378" font-size="13" fill="#94a3b8">per broadcast pass, at ~1.25 bits/s</text>
  </g>
  <text x="880" y="406" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#5c6b85">Figures: Calle's post, Sept 30, 2026 · find-my-nuts protocol doc</text>
</svg>
