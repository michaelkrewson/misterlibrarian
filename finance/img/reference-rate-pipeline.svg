<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img"
     aria-label="A pipeline diagram. Top row: six spot exchanges -- Bitstamp, Coinbase, Gemini, itBit, Kraken, and LMAX Digital -- each trading real Bitcoin for real dollars. Arrows from all six converge into CF Benchmarks, which calculates a volume-weighted median once daily over a one-hour window. A dashed line notes that CF Benchmarks is wholly owned by Kraken, one of the six exchanges feeding it, under FCA oversight. That produces the CME CF Bitcoin Reference Rate, a single number. That number feeds CME's Bitcoin futures contract, which settles in cash -- no Bitcoin changes hands at that final step.">
  <rect width="900" height="640" fill="#0a0f1a"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="19" fill="#e8dfd2">How CME's Bitcoin price actually gets made</text>
  <text x="40" y="64" font-family="Georgia, serif" font-size="12.5" fill="#94a3b8">Six real markets, one calculated number, one cash-settled contract</text>

  <!-- Six exchange boxes -->
  <!-- box width 132, gap 12, 6 boxes = 6*132+5*12=852, start x=24 -->
  <g font-family="Georgia, serif">
    <rect x="24"  y="92" width="132" height="74" rx="9" fill="#131b2c" stroke="#2f7d5c" stroke-width="1.5"/>
    <text x="90" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#5fbf94">Bitstamp</text>
    <text x="90" y="142" text-anchor="middle" font-size="10" fill="#94a3b8">spot BTC/USD</text>

    <rect x="168" y="92" width="132" height="74" rx="9" fill="#131b2c" stroke="#3b6fe0" stroke-width="1.5"/>
    <text x="234" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#7ea6f5">Coinbase</text>
    <text x="234" y="142" text-anchor="middle" font-size="10" fill="#94a3b8">spot BTC/USD</text>

    <rect x="312" y="92" width="132" height="74" rx="9" fill="#131b2c" stroke="#4fd0c5" stroke-width="1.5"/>
    <text x="378" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#7fe3da">Gemini</text>
    <text x="378" y="142" text-anchor="middle" font-size="10" fill="#94a3b8">spot BTC/USD</text>

    <rect x="456" y="92" width="132" height="74" rx="9" fill="#131b2c" stroke="#5a7ee0" stroke-width="1.5"/>
    <text x="522" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#8fa8ec">itBit</text>
    <text x="522" y="142" text-anchor="middle" font-size="10" fill="#94a3b8">(Paxos) spot</text>

    <rect x="600" y="92" width="132" height="74" rx="9" fill="#1c1430" stroke="#9a6fd6" stroke-width="1.5"/>
    <text x="666" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#c3a6ef">Kraken</text>
    <text x="666" y="142" text-anchor="middle" font-size="10" fill="#94a3b8">spot BTC/USD</text>

    <rect x="744" y="92" width="132" height="74" rx="9" fill="#131b2c" stroke="#5a6b80" stroke-width="1.5"/>
    <text x="810" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#c9d4e0">LMAX Digital</text>
    <text x="810" y="142" text-anchor="middle" font-size="10" fill="#94a3b8">spot BTC/USD</text>
  </g>

  <!-- Converging arrows into CF Benchmarks -->
  <g stroke="#3a4556" stroke-width="1.6" fill="none">
    <path d="M90 166 C 90 210, 300 210, 380 236"/>
    <path d="M234 166 C 234 205, 320 205, 385 232"/>
    <path d="M378 166 L 400 228"/>
    <path d="M522 166 L 500 228"/>
    <path d="M666 166 C 666 205, 580 205, 515 232"/>
    <path d="M810 166 C 810 210, 600 210, 520 236"/>
  </g>
  <polygon points="450,240 442,224 458,224" fill="#5a6b80"/>

  <!-- CF Benchmarks box -->
  <rect x="300" y="244" width="300" height="88" rx="10" fill="#111a29" stroke="rgba(255,255,255,.16)"/>
  <text x="450" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#e8dfd2">CF Benchmarks</text>
  <text x="450" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">volume-weighted median,</text>
  <text x="450" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">once daily, 1-hour window</text>
  <text x="450" y="324" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6e7d92">FCA-authorized under UK BMR</text>

  <!-- Kraken ownership note -->
  <path d="M666 166 C 666 190, 610 210, 600 244" stroke="#9a6fd6" stroke-width="1.3" stroke-dasharray="3,4" fill="none"/>
  <text x="640" y="200" font-family="Georgia, serif" font-size="10.5" font-style="italic" fill="#b28fe0">wholly owns</text>

  <!-- arrow down to reference rate -->
  <path d="M450 332 L 450 372" stroke="#5a6b80" stroke-width="2"/>
  <polygon points="450,380 442,364 458,364" fill="#5a6b80"/>

  <!-- Reference rate box -->
  <rect x="270" y="384" width="360" height="70" rx="10" fill="#1a1408" stroke="rgba(247,147,26,.5)"/>
  <text x="450" y="414" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#f7931a">CME CF Bitcoin Reference Rate</text>
  <text x="450" y="434" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a86a">one single number, published daily</text>

  <!-- arrow down to futures -->
  <path d="M450 454 L 450 494" stroke="#5a6b80" stroke-width="2"/>
  <polygon points="450,502 442,486 458,486" fill="#5a6b80"/>

  <!-- CME futures box -->
  <rect x="240" y="506" width="420" height="82" rx="10" fill="#111a29" stroke="rgba(255,255,255,.16)"/>
  <text x="450" y="536" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#e8dfd2">CME Bitcoin Futures</text>
  <text x="450" y="558" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">cash-settled against that number —</text>
  <text x="450" y="574" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#e8865c">no Bitcoin changes hands at this step</text>

  <text x="40" y="622" font-family="Georgia, serif" font-size="11.5" fill="#5a6b80">One of the six spot exchanges also wholly owns the company that decides how all six get weighted.</text>
</svg>
