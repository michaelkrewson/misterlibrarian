<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Timeline of twenty-four trading-strategy retirements between June 17 and September 1, 2026, on a 95-day project. Each strategy is a dot on the date it was retired, coloured by cause: six for no measured edge, five because the evidence did not survive scrutiny, two as unmeasurable at their firing rate, four as costing more than they could earn, four as beaten by a simpler sibling, three for no counterparty, wrong weather or a judgement call. Two, Bipolar and Stretch, traded real money. Three survivors, Arbitrageur, the Investor vault and CryptoTrend, stand at the right edge.">
