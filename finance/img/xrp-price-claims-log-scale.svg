<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-label="Log-scale bar chart comparing three XRP prices: today's price of $1.42; roughly $24.65, the price XRP would need to reach to match Bitcoin's market capitalization at today's circulating supply; and roughly $6,400, the price implied by a viral social-media post's fabricated $640 trillion market cap claim at XRP's maximum supply">
  <rect width="900" height="340" fill="#0a0f1a"/>

  <!-- log scale: $1 to $10,000 mapped to x=140..820, gridlines at each power of ten -->
  <line x1="140" y1="270" x2="820" y2="270" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
  <g font-family="Georgia, serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    <text x="140" y="292">$1</text>
    <text x="310" y="292">$10</text>
    <text x="480" y="292">$100</text>
    <text x="650" y="292">$1,000</text>
    <text x="820" y="292">$10,000</text>
  </g>
  <g stroke="rgba(255,255,255,.08)" stroke-width="1">
    <line x1="310" y1="60" x2="310" y2="270"/>
    <line x1="480" y1="60" x2="480" y2="270"/>
    <line x1="650" y1="60" x2="650" y2="270"/>
  </g>

  <!-- row 1: XRP today, $1.42 -->
  <text x="140" y="90" font-family="Georgia, serif" font-size="16" fill="#e8dfd2">XRP today, September 15</text>
  <rect x="140" y="102" width="26" height="26" rx="5" fill="#5c6b85" opacity="0.9"/>
  <text x="176" y="121" font-family="Georgia, serif" font-size="16" fill="#e8dfd2" font-weight="bold">$1.42</text>

  <!-- row 2: price to flip Bitcoin at today's supply -->
  <text x="140" y="160" font-family="Georgia, serif" font-size="16" fill="#e8dfd2">To match Bitcoin's market cap today</text>
  <rect x="140" y="172" width="237" height="26" rx="5" fill="#a3b378" opacity="0.9"/>
  <text x="387" y="191" font-family="Georgia, serif" font-size="16" fill="#e8dfd2" font-weight="bold">~$24.65</text>

  <!-- row 3: price implied by the fabricated $640T post -->
  <text x="140" y="230" font-family="Georgia, serif" font-size="16" fill="#e8dfd2">What the fabricated "$640 trillion" post implies</text>
  <rect x="140" y="242" width="647" height="26" rx="5" fill="#f7931a" opacity="0.92"/>
  <text x="797" y="261" font-family="Georgia, serif" font-size="16" fill="#e8dfd2" font-weight="bold">~$6,400</text>

  <text x="140" y="322" font-family="Georgia, serif" font-size="13.5" fill="#94a3b8" font-style="italic">
    Log scale — the gap between the middle bar and the bottom one is roughly 260-fold, not a rounding error.
  </text>
</svg>
