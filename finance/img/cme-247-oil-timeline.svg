<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img"
     aria-label="A timeline of CME Group's plan for 24/7 oil futures in 2026. June 11: CME announces a 24/7 contract. July 9: the CFTC says self-certifying while a public consultation was underway was premature, and stays the launch. October 2: CME withdraws the filing, citing industry concerns about unintended consequences. Below, four objections raised by industry and reported by secondary outlets: thin weekend liquidity, margin calls outside business hours, weekend staffing, and commercial hedging.">
  <rect width="900" height="360" fill="#0a0f1a"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="18" fill="#e8dfd2">Four months, one contract <tspan fill="#94a3b8">— CME's 24/7 oil plan, 2026</tspan></text>

  <line x1="90" y1="120" x2="810" y2="120" stroke="rgba(255,255,255,.25)" stroke-width="2"/>

  <circle cx="130" cy="120" r="9" fill="#7fae6a"/>
  <text x="130" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#e8dfd2">Jun 11</text>
  <text x="130" y="154" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#e8dfd2">CME announces</text>
  <text x="130" y="171" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#94a3b8">24/7 oil contract</text>

  <circle cx="420" cy="120" r="9" fill="#d9a441"/>
  <text x="420" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#e8dfd2">Jul 9</text>
  <text x="420" y="154" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#e8dfd2">CFTC stays the launch</text>
  <text x="420" y="171" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#94a3b8">"premature" mid-consultation</text>

  <circle cx="770" cy="120" r="9" fill="#c15b5b"/>
  <text x="770" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#e8dfd2">Fri Oct 2</text>
  <text x="770" y="154" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#e8dfd2">CME withdraws filing</text>
  <text x="770" y="171" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#94a3b8">"unintended consequences"</text>

  <text x="40" y="226" font-family="Georgia, serif" font-size="14" fill="#e8dfd2">What industry said was in the way <tspan fill="#94a3b8" font-size="12">(as reported; CME's own release names none)</tspan></text>
  <g font-family="Georgia, serif" font-size="13" fill="#e8dfd2">
    <rect x="40" y="244" width="190" height="64" rx="6" fill="rgba(255,255,255,.06)"/>
    <text x="135" y="272" text-anchor="middle">Thin weekend</text><text x="135" y="290" text-anchor="middle">liquidity</text>
    <rect x="250" y="244" width="190" height="64" rx="6" fill="rgba(255,255,255,.06)"/>
    <text x="345" y="272" text-anchor="middle">Margin calls outside</text><text x="345" y="290" text-anchor="middle">business hours</text>
    <rect x="460" y="244" width="190" height="64" rx="6" fill="rgba(255,255,255,.06)"/>
    <text x="555" y="272" text-anchor="middle">Weekend</text><text x="555" y="290" text-anchor="middle">staffing</text>
    <rect x="670" y="244" width="190" height="64" rx="6" fill="rgba(255,255,255,.06)"/>
    <text x="765" y="272" text-anchor="middle">Commercial</text><text x="765" y="290" text-anchor="middle">hedging</text>
  </g>
  <text x="40" y="338" font-family="Georgia, serif" font-size="11.5" fill="#94a3b8">Dates and objections as reported by Bloomberg Law, RTTNews, CME's release, and secondary outlets; see Sources.</text>
</svg>
