<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Log-scale chart of the list price of a million input tokens from November 2021 to September 2026. Two lines start together at sixty dollars for GPT-3. The cheapest model of GPT-3 quality falls to six cents by November 2024, a thousandfold drop. The most capable model on sale falls only to thirty dollars for GPT-4 in March 2023, fifteen for Claude Opus 4.1 in August 2025, and ten for Claude Fable 5.1 in 2026, with Claude Opus 5 at five. A lone marker shows DeepSeek R1, an open-weight model near the frontier, at fifty-five cents in January 2025.">
