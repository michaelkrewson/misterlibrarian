<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Chart of one share of Strategy's STRC preferred stock through November 2026. Top panel, today's semi-monthly schedule: two dividends of fifty cents each, on the fifteenth and the thirtieth. Bottom panel, the proposed daily schedule on the same scale: thirty payments of three or four cents, one for every calendar day including weekends, each paid the next business day, so Mondays carry about ten cents. Both schedules add up to exactly one dollar for the month at a twelve percent rate. The price drop on each record date shrinks from about fifty cents to about three.">
