<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Log-log chart of the price an automated market maker prints against the dollars of buying sent into it, for two pool sizes seeded at five cents. With five thousand dollars of liquidity, ten thousand dollars of buying prints about a dollar, one hundred thousand prints about eighty-four dollars, two hundred thousand prints the three hundred thirty-nine dollar high, and a million prints eight thousand dollars. With two and a half million dollars of liquidity, the same million dollars of buying moves the price only to sixteen cents, and ten million to about four dollars.">
