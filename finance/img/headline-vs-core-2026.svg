<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Line chart of US consumer price inflation, twelve-month change, January 2024 to August 2026. Two lines: headline CPI in gold and core CPI excluding food and energy in blue. They run close together around three percent through 2024 and 2025. From March 2026, shaded as the Hormuz closure, the headline line rises to 3.4 percent by August while the core line drifts down to 2.4 percent, close to the Fed's 2 percent target line.">
<rect width="900" height="500" fill="#0a0f1a"/>
<text x="450.0" y="34.0" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#e8dfd2">The inflation the Fed is about to raise rates against</text>
<text x="450.0" y="57.0" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#94a3b8" font-style="italic">consumer prices, change from a year earlier</text>
