<text x="70.0" y="460.0" text-anchor="start" font-family="Georgia, serif" font-size="11.5" fill="#94a3b8">Source: BLS via FRED (CPIAUCSL, CPILFESL), seasonally adjusted, through August 2026. Gasoline (+27% on the year) was over a third of August's monthly rise;</text>
<text x="70.0" y="477.0" text-anchor="start" font-family="Georgia, serif" font-size="11.5" fill="#94a3b8">energy overall +16.3%, fuel oil +52%, airfares +23%. Take energy out and the number the Fed is fighting is 2.4%.</text>
