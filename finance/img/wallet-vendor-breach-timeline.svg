<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img"
     aria-label="Timeline of seven third-party breaches at Ledger and Trezor, in order: Ledger's e-commerce database July 2020, Trezor's Mailchimp list April 2022, Ledger's Connect Kit npm package December 2023, Trezor's support desk January 2024, Ledger's Global-e payment partner January 2026, Trezor's ShipMonk shipping data August 2026, and Trezor's Brevo email account September 2026. Three of the seven fall in 2026.">
  <rect width="900" height="350" fill="#0a0f1a"/>

  <text x="450" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#e8dfd2">
    Seven breaches, none of them a wallet
  </text>

  <!-- the 2026 cluster, shaded because three of seven land in one year -->
  <rect x="518" y="44" width="350" height="228" rx="8" fill="#ffffff" opacity="0.045"/>
  <text x="860" y="64" text-anchor="end" font-family="Georgia, serif" font-size="14.5" fill="#94a3b8" font-style="italic">three of them in 2026</text>

  <!-- axis -->
  <line x1="70" y1="180" x2="862" y2="180" stroke="rgba(255,255,255,.20)" stroke-width="1.5"/>

  <!-- 1. Ledger, e-commerce DB, July 2020 (above) -->
  <text x="100" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#8ab4d8" font-weight="bold">e-commerce</text>
  <text x="100" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#8ab4d8" font-weight="bold">database</text>
  <text x="100" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#94a3b8">Jul 2020</text>
  <circle cx="100" cy="180" r="7" fill="#8ab4d8"/>

  <!-- 2. Trezor, Mailchimp, April 2022 (below) -->
  <text x="218" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#94a3b8">Apr 2022</text>
  <text x="218" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#e8865c" font-weight="bold">Mailchimp</text>
  <text x="218" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#e8865c" font-weight="bold">list</text>
  <circle cx="218" cy="180" r="7" fill="#e8865c"/>

  <!-- 3. Ledger, Connect Kit, December 2023 (above) -->
  <text x="337" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#8ab4d8" font-weight="bold">Connect Kit</text>
  <text x="337" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#8ab4d8" font-weight="bold">(npm)</text>
  <text x="337" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#94a3b8">Dec 2023</text>
  <circle cx="337" cy="180" r="7" fill="#8ab4d8"/>

  <!-- 4. Trezor, support desk, January 2024 (below) -->
  <text x="455" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#94a3b8">Jan 2024</text>
  <text x="455" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#e8865c" font-weight="bold">support</text>
  <text x="455" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#e8865c" font-weight="bold">desk</text>
  <circle cx="455" cy="180" r="7" fill="#e8865c"/>

  <!-- 5. Ledger, Global-e, January 2026 (above) -->
  <text x="573" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#8ab4d8" font-weight="bold">Global-e</text>
  <text x="573" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#8ab4d8" font-weight="bold">payments</text>
  <text x="573" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#94a3b8">Jan 2026</text>
  <circle cx="573" cy="180" r="7" fill="#8ab4d8"/>

  <!-- 6. Trezor, ShipMonk, August 2026 (below) -->
  <text x="692" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#94a3b8">Aug 2026</text>
  <text x="692" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#e8865c" font-weight="bold">ShipMonk</text>
  <text x="692" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#e8865c" font-weight="bold">shipping</text>
  <circle cx="692" cy="180" r="7" fill="#e8865c"/>

  <!-- 7. Trezor, Brevo, September 2026 (below) -->
  <text x="810" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#94a3b8">Sep 2026</text>
  <text x="810" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#e8865c" font-weight="bold">Brevo</text>
  <text x="810" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#e8865c" font-weight="bold">email</text>
  <circle cx="810" cy="180" r="9" fill="#e8865c"/>
  <circle cx="810" cy="180" r="15" fill="none" stroke="#e8865c" stroke-width="1.3" opacity="0.55"/>

  <!-- legend -->
  <circle cx="82" cy="303" r="6" fill="#8ab4d8"/>
  <text x="96" y="308" font-family="Georgia, serif" font-size="15" fill="#8ab4d8">Ledger</text>
  <circle cx="176" cy="303" r="6" fill="#e8865c"/>
  <text x="190" y="308" font-family="Georgia, serif" font-size="15" fill="#e8865c">Trezor</text>
  <text x="862" y="308" text-anchor="end" font-family="Georgia, serif" font-size="14.5" fill="#94a3b8" font-style="italic">
    In order, not to scale — the gaps are chronology, not duration.
  </text>

  <text x="450" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="14.5" fill="#94a3b8" font-style="italic">
    A mailing list, a shipping label, a support ticket, a payment record, a software package.
  </text>
</svg>
