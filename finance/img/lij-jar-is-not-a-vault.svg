<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img"
     aria-label="Two containers side by side. On the left, a large safe labelled the vault: cold storage, a hardware wallet or multisig, keys that never touch the internet, your savings, the vast majority of what you hold. On the right, a small jar with a lightning bolt inside labelled the jar on the counter: a Lightning wallet, keys on a phone or in a browser, spending money, what you would carry in a physical wallet, an amount you could lose without it changing your week. Between them, an arrow: refill the jar from the vault, not the other way round.">
  <rect width="900" height="600" fill="#0a0f1a"/>

  <text x="450" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="20" fill="#e8dfd2">A jar is not a vault</text>

  <!-- THE VAULT -->
  <g transform="translate(230,200)">
    <rect x="-95" y="-100" width="190" height="200" rx="14" fill="#0d1520" stroke="#a3b378" stroke-width="3"/>
    <rect x="-78" y="-83" width="156" height="166" rx="8" fill="none" stroke="rgba(163,179,120,.45)" stroke-width="1.5"/>
    <circle cx="-22" cy="0" r="30" fill="none" stroke="#e8dfd2" stroke-width="2.5"/>
    <circle cx="-22" cy="0" r="16" fill="none" stroke="#e8dfd2" stroke-width="2"/>
    <line x1="-22" y1="-16" x2="-22" y2="-30" stroke="#e8dfd2" stroke-width="2.5"/>
    <line x1="-22" y1="16" x2="-22" y2="30" stroke="#e8dfd2" stroke-width="2.5"/>
    <line x1="-38" y1="0" x2="-52" y2="0" stroke="#e8dfd2" stroke-width="2.5"/>
    <line x1="-6" y1="0" x2="8" y2="0" stroke="#e8dfd2" stroke-width="2.5"/>
    <rect x="34" y="-40" width="14" height="80" rx="5" fill="none" stroke="#e8dfd2" stroke-width="2.2"/>
    <line x1="-95" y1="-60" x2="-110" y2="-60" stroke="#a3b378" stroke-width="3"/>
    <line x1="-95" y1="60" x2="-110" y2="60" stroke="#a3b378" stroke-width="3"/>
  </g>
  <text x="230" y="335" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#e8dfd2">The vault</text>
  <text x="230" y="358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#a3b378" font-style="italic">cold storage</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e8dfd2">
    <text x="230" y="392" text-anchor="middle">a hardware wallet, or a multisig</text>
    <text x="230" y="418" text-anchor="middle">keys that never touch the internet</text>
    <text x="230" y="444" text-anchor="middle">your savings</text>
    <text x="230" y="472" text-anchor="middle" fill="#a3b378">the vast majority of what you hold</text>
  </g>

  <!-- ARROW between -->
  <g transform="translate(450,200)">
    <line x1="-90" y1="0" x2="70" y2="0" stroke="#e8c968" stroke-width="2"/>
    <polygon points="70,-7 84,0 70,7" fill="#e8c968"/>
    <text x="0" y="-16" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#e8c968">refill the jar from the vault</text>
    <text x="0" y="24" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#94a3b8" font-style="italic">a little at a time, as you spend it</text>
  </g>

  <!-- THE JAR (drawn like his icon) -->
  <g transform="translate(670,205)">
    <rect x="-42" y="-100" width="84" height="22" rx="7" fill="#1a1208" stroke="#f3e9d2" stroke-width="3"/>
    <path d="M -32 -78 L -32 -62 Q -70 -52 -70 -10 L -70 68 Q -70 92 -46 92 L 46 92 Q 70 92 70 68 L 70 -10 Q 70 -52 32 -62 L 32 -78 Z"
          fill="#1a1208" stroke="#f3e9d2" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="8,-54 -14,-2 6,4 -12,52 24,-4 4,-10 18,-54"
              fill="none" stroke="#f0b97a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text x="670" y="335" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#e8dfd2">The jar on the counter</text>
  <text x="670" y="358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#f0b97a" font-style="italic">a Lightning wallet — any of them</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e8dfd2">
    <text x="670" y="392" text-anchor="middle">keys on a phone, or in a browser</text>
    <text x="670" y="418" text-anchor="middle">spending money</text>
    <text x="670" y="444" text-anchor="middle">what you'd carry in a wallet</text>
    <text x="670" y="472" text-anchor="middle" fill="#f0b97a">an amount that wouldn't change your week</text>
  </g>

  <!-- footer -->
  <line x1="60" y1="505" x2="840" y2="505" stroke="rgba(148,163,184,.25)" stroke-width="1"/>
  <text x="450" y="535" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="16" fill="#e8dfd2">Nobody keeps their life savings in a jar on the kitchen counter.</text>
  <text x="450" y="558" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="16" fill="#e8dfd2">Not because jars are bad — because that isn't what a jar is <tspan fill="#f0b97a">for</tspan>.</text>
  <text x="450" y="584" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#94a3b8" font-style="italic">This is true of every Lightning wallet ever made, the ones with audits included.</text>
</svg>
