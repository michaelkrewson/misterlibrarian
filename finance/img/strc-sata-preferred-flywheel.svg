<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img"
     aria-label="Top: a four-step flow diagram. Yield-seeking investors who want Bitcoin exposure without its volatility put cash into STRC or SATA preferred stock, paying 11 to 13 percent a year. That cash becomes proceeds for Strategy Inc. or Strive. Those companies use the proceeds to buy Bitcoin. That Bitcoin is held permanently and never resold, arrow labeled one-way, no return path back to the market. Bottom: a bar comparison. New Bitcoin mined per day since the 2024 halving is about 450 coins, a short bar. Combined ETF and corporate treasury demand per day is about 9,000 coins, a bar roughly twenty times longer. Caption: treasury companies are absorbing Bitcoin at about 2.8 times the pace new coins are mined.">
  <rect width="900" height="560" fill="#0a0f1a"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="19" fill="#e8dfd2">Where the money actually goes</text>
  <text x="40" y="64" font-family="Georgia, serif" font-size="12.5" fill="#94a3b8">Cash in, Bitcoin out — and it never comes back</text>

  <!-- Step 1: Investors -->
  <rect x="30" y="96" width="180" height="92" rx="10" fill="#111a29" stroke="rgba(255,255,255,.14)"/>
  <text x="120" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="13.5" font-weight="bold" fill="#e8dfd2">Yield investors</text>
  <text x="120" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">want BTC-adjacent</text>
  <text x="120" y="161" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">yield, not volatility</text>
  <text x="120" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#a3b378">cash in →</text>

  <path d="M212 142 L246 142" stroke="#5a6b80" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Preferred stock -->
  <rect x="248" y="96" width="180" height="92" rx="10" fill="#1a1408" stroke="rgba(247,147,26,.35)"/>
  <text x="338" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="13.5" font-weight="bold" fill="#e8c489">STRC · SATA</text>
  <text x="338" y="142" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a86a">perpetual preferred</text>
  <text x="338" y="157" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a86a">stock, ~$100 par</text>
  <text x="338" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#f7931a">11–13%/yr</text>

  <path d="M430 142 L464 142" stroke="#5a6b80" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Company -->
  <rect x="466" y="96" width="180" height="92" rx="10" fill="#111a29" stroke="rgba(255,255,255,.14)"/>
  <text x="556" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="13.5" font-weight="bold" fill="#e8dfd2">Strategy · Strive</text>
  <text x="556" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">receives proceeds,</text>
  <text x="556" y="161" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#94a3b8">funds the balance sheet</text>
  <text x="556" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#a3b378">deploys it →</text>

  <path d="M648 142 L682 142" stroke="#5a6b80" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Bitcoin, permanent hold -->
  <rect x="684" y="96" width="186" height="92" rx="10" fill="#1a1408" stroke="rgba(247,147,26,.55)"/>
  <text x="777" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="13.5" font-weight="bold" fill="#f7931a">Bitcoin bought</text>
  <text x="777" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a86a">held on the balance</text>
  <text x="777" y="161" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a86a">sheet, by design</text>
  <text x="777" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#e8865c">never resold</text>

  <!-- one-way loop back down and to the left, explicitly dead-ending -->
  <path d="M777 190 C 777 215, 120 215, 120 190" stroke="#3a4556" stroke-width="1.6"
        stroke-dasharray="3,4" fill="none"/>
  <text x="448" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="11.5"
        font-style="italic" fill="#5a6b80">no return path — a 2017 buyer's coins came back to market; this doesn't</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b80"/>
    </marker>
  </defs>

  <line x1="40" y1="270" x2="860" y2="270" stroke="rgba(255,255,255,.1)"/>

  <!-- Bottom: mined vs absorbed bar comparison -->
  <text x="40" y="304" font-family="Georgia, serif" font-size="15" fill="#e8dfd2">New supply vs. structural demand, per day</text>

  <text x="40" y="344" font-family="Georgia, serif" font-size="12.5" fill="#94a3b8">Mined (since the 2024 halving)</text>
  <rect x="260" y="330" width="22" height="20" rx="3" fill="#3a4556"/>
  <text x="290" y="345" font-family="Georgia, serif" font-size="13" fill="#e8dfd2">~450 BTC/day</text>

  <text x="40" y="392" font-family="Georgia, serif" font-size="12.5" fill="#94a3b8">ETF + treasury demand</text>
  <rect x="260" y="378" width="440" height="20" rx="3" fill="#f7931a"/>
  <text x="712" y="393" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#f7931a">~9,000 BTC/day</text>

  <line x1="260" y1="320" x2="260" y2="410" stroke="rgba(255,255,255,.15)"/>

  <text x="40" y="450" font-family="Georgia, serif" font-size="13" fill="#c9d4e0">Treasury companies alone are absorbing Bitcoin at roughly</text>
  <text x="40" y="470" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#f7931a">2.8 times the pace new coins are mined —</text>
  <text x="40" y="494" font-family="Georgia, serif" font-size="13" fill="#c9d4e0">and the STRC/SATA cash-to-BTC pipeline above is the fastest-growing</text>
  <text x="40" y="514" font-family="Georgia, serif" font-size="13" fill="#c9d4e0">piece of that, replicating across companies rather than staying one balance sheet.</text>
</svg>
