<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="A hand-redrawn line chart titled 'Correlation between screen size and your importance in the company'. The horizontal axis lists five devices from smallest to largest screen: iPhone, iPad, 13-inch laptop, one monitor, two monitors. The vertical axis lists five job levels from CEO at the top down to 'corporate slave' at the bottom. A smooth S-shaped curve falls from the CEO level at the iPhone to the bottom level at two monitors, passing through executive at the iPad, upper management at the laptop, and middle management at one monitor.">
