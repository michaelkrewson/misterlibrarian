<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 700" role="img" aria-label="A diagram titled Is Bitcoin tokenized compute? Three boxes in a chain. Left: energy spent on hashing in the past, SHA-256 chips that do nothing else. Middle: BTC. Right: GPU time for AI inference in the future. The arrow from the left box to the middle is labelled Holds, because block rewards require real work. The arrow from the middle box to the right is labelled Strained, because compute is priced in dollars and AI agents mostly pay in USDC today. A bottom strip notes that hashing and AI math are different computations, so what carries over is the energy and money spent, not the compute itself. A footer says the verdicts are the author's reading.">
<rect width="1750" height="700" fill="#0a0f1a"/>
<text x="875" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#e8c968" font-style="italic">Is Bitcoin &#8220;tokenized compute&#8221;?</text>
<text x="875" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#94a3b8">Jason Lowery&#8217;s chain, link by link: past work, then BTC, then future AI compute</text>
<rect x="70" y="170" width="450" height="230" rx="16" fill="#0d1520" stroke="#e8865c" stroke-width="2"/>
<rect x="650" y="170" width="450" height="230" rx="16" fill="#0d1520" stroke="#e8c968" stroke-width="2"/>
<rect x="1230" y="170" width="450" height="230" rx="16" fill="#0d1520" stroke="#7fb8a4" stroke-width="2"/>
<g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
<text x="295" y="222" font-size="18" fill="#94a3b8" letter-spacing="2">THE PAST</text>
<text x="295" y="276" font-size="28" fill="#e8dfd2">Energy spent hashing</text>
<text x="295" y="318" font-size="19" fill="#c9bfae">SHA-256 chips that do</text>
<text x="295" y="346" font-size="19" fill="#c9bfae">nothing else</text>
<text x="875" y="222" font-size="18" fill="#94a3b8" letter-spacing="2">THE TOKEN</text>
<text x="875" y="300" font-size="46" fill="#e8c968">BTC</text>
<text x="875" y="346" font-size="19" fill="#c9bfae">fixed supply, 21 million</text>
<text x="1455" y="222" font-size="18" fill="#94a3b8" letter-spacing="2">THE FUTURE</text>
<text x="1455" y="276" font-size="28" fill="#e8dfd2">GPU time for inference</text>
<text x="1455" y="318" font-size="19" fill="#c9bfae">matrix math, priced</text>
<text x="1455" y="346" font-size="19" fill="#c9bfae">in dollars</text>
</g>
<g stroke-width="5" fill="none" stroke-linecap="round">
<path d="M530 285 L640 285" stroke="#7fb8a4"/>
<path d="M630 268 L645 285 L630 302" stroke="#7fb8a4"/>
<path d="M1110 285 L1220 285" stroke="#e8865c" stroke-dasharray="4 12"/>
<path d="M1210 268 L1225 285 L1210 302" stroke="#e8865c"/>
</g>
<g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
<text x="585" y="236" font-size="22" font-weight="bold" fill="#7fb8a4">HOLDS</text>
<text x="585" y="334" font-size="15" fill="#94a3b8">rewards need</text>
<text x="585" y="354" font-size="15" fill="#94a3b8">real work</text>
<text x="1165" y="236" font-size="22" font-weight="bold" fill="#e8865c">STRAINED</text>
<text x="1165" y="334" font-size="15" fill="#94a3b8">agents mostly</text>
<text x="1165" y="354" font-size="15" fill="#94a3b8">pay in USDC</text>
</g>
<rect x="70" y="450" width="1610" height="110" rx="14" fill="#0d1520" stroke="#334155" stroke-width="1.5"/>
<g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
<text x="875" y="494" font-size="22" fill="#e8dfd2">Hashing and AI math are different computations.</text>
<text x="875" y="530" font-size="19" fill="#c9bfae">What carries from left to right is the energy and money spent, not the compute itself.</text>
</g>
<text x="875" y="640" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#94a3b8">The verdicts are the author&#8217;s reading of the evidence. Claim from a post by Jason Lowery on X, October 7, 2026 (UTC).</text>
</svg>
