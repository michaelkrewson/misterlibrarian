<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img"
     aria-label="How one LBMA Gold Price auction works. A starting price is set from the market. Round one: for 30 seconds, participants can enter, change or cancel orders. When the round ends, buy and sell orders are netted. If the gap between buyers and sellers is 10,000 ounces or less, the auction ends and everyone trades their net amount at that price. If the gap is bigger, the price is moved and a new 30-second round starts. Below: orders that are still standing when the price is set are binding trades, and the platform caps each participant at 75 order messages a minute.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#0a0f1a"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="19" fill="#e8dfd2">One gold auction, start to finish</text>
  <text x="40" y="64" font-family="Georgia, serif" font-size="12.5" fill="#94a3b8">10:30 and 15:00 London time, every London business day. Specs from ICE's January 2026 sheet.</text>

  <rect x="30" y="92" width="170" height="104" rx="10" fill="#111a29" stroke="rgba(255,255,255,.14)"/>
  <text x="115" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a6b80">START</text>
  <text x="115" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#e8dfd2">Opening price</text>
  <text x="115" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#94a3b8">set by the administrator</text>
  <text x="115" y="177" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#94a3b8">from current market levels</text>

  <path d="M204 144 L240 144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="244" y="92" width="190" height="104" rx="10" fill="#111a29" stroke="rgba(255,255,255,.14)"/>
  <text x="339" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a6b80">A ROUND · 30 SECONDS</text>
  <text x="339" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#e8dfd2">Orders in, out, changed</text>
  <text x="339" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#94a3b8">buy and sell, in troy ounces</text>
  <text x="339" y="177" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#94a3b8">capped at 75 messages a minute</text>

  <path d="M438 144 L474 144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="478" y="92" width="190" height="104" rx="10" fill="#111a29" stroke="rgba(255,255,255,.14)"/>
  <text x="573" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a6b80">ROUND ENDS</text>
  <text x="573" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#e8dfd2">Net the book</text>
  <text x="573" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#94a3b8">buyers' ounces minus</text>
  <text x="573" y="177" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#94a3b8">sellers' ounces</text>

  <path d="M672 144 L706 144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="710" y="92" width="160" height="104" rx="10" fill="#111a29" stroke="#d4a64a"/>
  <text x="790" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#d4a64a">GAP 10,000 OZ OR LESS?</text>
  <text x="790" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#e8dfd2">Yes: price is set</text>
  <text x="790" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#94a3b8">net amounts trade at it,</text>
  <text x="790" y="177" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#94a3b8">for real</text>

  <path d="M790 200 L790 244 L339 244 L339 200" stroke="#e8865c" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="565" y="236" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#e8865c">No: price moves, new 30-second round</text>

  <rect x="30" y="284" width="840" height="150" rx="10" fill="#111a29" stroke="rgba(255,255,255,.14)"/>
  <text x="50" y="312" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#e8dfd2">Why this is not the spoofing game from the futures pits</text>
  <text x="50" y="338" font-family="Georgia, serif" font-size="12.5" fill="#94a3b8">Spoofing works by showing a big order and pulling it before anyone can trade against it.</text>
  <text x="50" y="360" font-family="Georgia, serif" font-size="12.5" fill="#94a3b8">Here, only the book at the END of a round decides the next price, and whatever is standing</text>
  <text x="50" y="382" font-family="Georgia, serif" font-size="12.5" fill="#94a3b8">when the price is finally set is a real trade, with leftover imbalance shared among the direct participants.</text>
  <text x="50" y="410" font-family="Georgia, serif" font-size="12" fill="#d4a64a">Harder is not the same as impossible, and no one has publicly tested it in court. See "Where I could be wrong."</text>
</svg>
