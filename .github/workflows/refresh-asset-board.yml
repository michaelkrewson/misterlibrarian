# Keep /finance/ current without a server.
#
#     tools/fetch_asset_board.py    public quotes    -> source/finance/asset_board.json
#     tools/fetch_bitcoin_stats.py  the network      -> source/finance/bitcoin_stats.json
#     tools/finance_logos.py        fetches any logo we don't already have cached
#     build_finance.py              renders both boards from that JSON (stdlib only)
#     commit + push to main         GitHub Pages redeploys (source: main /)
#
# HOURLY IS THE FLOOR HERE, NOT THE CEILING
# The Bitcoin board also refreshes itself in the reader's browser, straight from
# mempool.space, so what this schedule actually governs is how fresh the page is
# for someone with JavaScript off and how good the fallback is when that API is
# down. That is why going sub-hourly was considered and rejected: it would buy
# almost nothing a visitor could see, at 144 commits and 144 Pages deploys a day.
#
# WHY THIS NEEDS NO SECRET
# Every input is a public market quote. There is no account, no key, and nothing
# personal anywhere in this path — which is what makes it safe to run in a public
# repo. The only token involved is the automatic GITHUB_TOKEN.
#
# WHY IT WILL NOT GO RED ON A BAD DAY
# Yahoo rate-limits datacenter IP ranges far harder than a home connection, so a run
# that resolves nothing is a question of when, not if. fetch_asset_board.py exits 0
# and writes nothing in that case, the build re-renders from the last committed
# board, and the page keeps showing slightly older figures with an honest "Updated"
# timestamp on it. A stale board beats a blank page and beats a red inbox.
#
# IF YAHOO BLOCKS THE RUNNER FOR GOOD
# The committed JSON is the interface, not this workflow. Point any other machine at
# `python3 tools/fetch_asset_board.py` on a schedule and have it commit the same
# file; the builder and the page do not change.

# The file name stays refresh-asset-board.yml on purpose — GitHub keys a
# workflow's schedule and run history to its PATH, so renaming the file would
# start it over as a stranger. Only the display name changed when the Bitcoin
# board joined it.
name: Refresh the boards

on:
  schedule:
    # Hourly (2026-08-08, was every 6 hours). The ranking still barely moves day
    # to day — this isn't about being a live ticker, it's about the Bitcoin count
    # (now derived from the live block height, not a once-a-year guess below)
    # staying genuinely current: Bitcoin mines ~6 blocks an hour, so hourly is
    # roughly the finest cadence a reader would actually notice. Going tighter
    # buys little and risks two things: GitHub documents that sub-hourly
    # scheduled crons get unreliable (silently delayed/skipped under load), and
    # Yahoo rate-limits a repeatedly-polling datacenter IP harder than that.
    # ⚠️ MEASURED 2026-09-03: this is NOT running hourly and has not been for
    # some time. Thirteen consecutive scheduled runs landed at 17:45, 13:28,
    # 08:45, 03:58, 23:12, 20:52, 17:48 … — a repeating pattern of roughly SIX
    # runs a day, 2.5 to 5 hours apart. GitHub is dropping the rest, which is
    # its documented behaviour for a public repo under load and is not
    # something a tighter cron would fix (asking for more would get us fewer:
    # sub-hourly schedules are dropped harder still).
    #
    # This is exactly why the Bitcoin board refreshes itself in the reader's
    # browser. That live layer is not a nicety on top of a fresh page — it is
    # what keeps the page current at all, because this schedule alone would
    # leave it up to five hours stale.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Two refreshes at once would race on the same branch.
concurrency:
  group: refresh-asset-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: python -m pip install --quiet --upgrade yfinance

      - name: Fetch the asset board
        run: python3 tools/fetch_asset_board.py

      # Deliberately a separate step from the asset board rather than one
      # combined "fetch everything": a Yahoo rate-limit must not cost the
      # Bitcoin board its refresh, and a mempool.space outage must not cost the
      # asset board its own. Both scripts exit 0 on a bad day and write nothing,
      # so either can fail without failing the run — but only if they are not
      # chained together. Needs no pip install; it is standard library only.
      - name: Fetch the Bitcoin board
        run: python3 tools/fetch_bitcoin_stats.py

      - name: Cache any missing logos
        run: python3 tools/finance_logos.py

      - name: Rebuild /finance/
        run: python3 build_finance.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/finance finance
          if git diff --cached --quiet; then
            echo "nothing changed — not committing"
            exit 0
          fi
          git commit -m "Refresh the boards"
          # Someone may have pushed while we were fetching; rebase rather than fail.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
